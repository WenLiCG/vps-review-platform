[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-review-pipeline"
version = "0.2.0"
description = "Bounded public first-post archives and honest assistant review workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vps-review = "vps_pipeline.cli:main"

[tool.setuptools]
packages = ["vps_pipeline"]

[tool.setuptools.package-data]
vps_pipeline = ["vendor/vps-review-analyze/SKILL.md", "vendor/vps-review-analyze/references/*.json", "vendor/vps-review-analyze/references/*.md", "vendor/vps-review-analyze/scripts/*.py"]
